<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawau Olamide — AI & Speech Research Portfolio</title>
    <meta name="description" content="Personal research portfolio of Hawau Olamide Toyin — PhD Researcher in Speech Processing, ASR, and Multilingual NLP at MBZUAI." />
    <meta property="og:title" content="Hawau Olamide — AI & Speech Research Portfolio" />
    <meta property="og:description" content="Personal research portfolio of Hawau Olamide Toyin — PhD Researcher in Speech Processing, ASR, and Multilingual NLP at MBZUAI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var ver = localStorage.getItem('portfolio_theme_version');
          if (ver !== '2') {
            localStorage.removeItem('portfolio_theme');
            localStorage.setItem('portfolio_theme_version', '2');
            localStorage.setItem('portfolio_theme', 'light');
          }
          var theme = localStorage.getItem('portfolio_theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 dark:bg-[#090A0F] dark:text-slate-100 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
